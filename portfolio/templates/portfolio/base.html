{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Makki's Portfolio{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'portfolio/images/favicon.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
    :root {
        --primary-color: #14a800;
        --secondary-color: #00ff88;
        --accent-color: #108a00;
        --dark-bg: #011410;
        --light-bg: #021a15;
        --section-bg: rgba(20, 168, 0, 0.03);
        --card-bg: rgba(1, 29, 22, 0.65);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        --hover-shadow: 0 12px 24px rgba(20, 168, 0, 0.25);
        --border-color: rgba(20, 168, 0, 0.15);
    }
    
    [data-theme="dark"] {
        --primary-color: #14a800;
        --secondary-color: #00ff88;
        --accent-color: #108a00;
        --dark-bg: #011410;
        --light-bg: #021a15;
        --section-bg: rgba(20, 168, 0, 0.03);
        --card-bg: rgba(1, 29, 22, 0.65);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        --hover-shadow: 0 12px 24px rgba(20, 168, 0, 0.25);
        --border-color: rgba(20, 168, 0, 0.15);
    }
        
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--dark-bg);
            background-attachment: fixed;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }
        
        [data-theme="dark"] body {
            background: var(--dark-bg);
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(at 0% 0%, rgba(20, 168, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 255, 136, 0.06) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(1, 20, 16, 1) 0px, transparent 100%);
            z-index: -2;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .theme-toggle {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 1001;
            background: var(--light-bg);
            border: 2px solid var(--primary-color);
            border-radius: 50px;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        [data-theme="dark"] .theme-toggle {
            background: var(--dark-bg);
            border-color: var(--accent-color);
        }
        
        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--hover-shadow);
        }
        
        .theme-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .sun-icon {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #ff6b35;
        }
        
        .moon-icon {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #ecf0f1;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            background: var(--primary-color);
            border-radius: 50%;
            opacity: 0.3;
            animation: float-particle 15s infinite linear;
        }
        
        @keyframes float-particle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        header {
            background: rgba(1, 20, 16, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(20, 168, 0, 0.15);
        }
        
        header.scrolled {
            background: rgba(1, 20, 16, 0.95);
            padding: 0.2rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .navbar {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }
        
        .logo-f {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 800;
            box-shadow: 0 8px 16px rgba(20, 168, 0, 0.25);
            transition: all 0.3s ease;
        }
        
        .logo:hover .logo-f {
            transform: scale(1.05);
            box-shadow: 0 12px 24px rgba(20, 168, 0, 0.35);
        }
        
        .hire-me-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(20, 168, 0, 0.25);
        }
        
        .hire-me-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(20, 168, 0, 0.35);
            filter: brightness(1.1);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }
        
        .nav-links a {
            color: rgba(248, 250, 252, 0.7);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
        }
        
        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }
        
        main {
            margin: 0;
            padding: 0;
            width: 100%;
            margin-top: 80px;
            min-height: calc(100vh - 80px);
            box-sizing: border-box;
        }
        
        .hero {
            background: linear-gradient(135deg, #022c22 0%, #011d16 100%);
            border: 1px solid rgba(20, 168, 0, 0.15);
            color: white;
            text-align: center;
            padding: 6rem 0;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(20, 168, 0, 0.08) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: float 20s linear infinite;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-20px, -20px); }
        }
        
        .hero-content {
            position: relative;
            z-index: 1;
        }
        
        .hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #85ffa1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out;
        }
        
        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hero p {
            font-size: 1.4rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        @keyframes slideInFromBottom {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 0.9;
                transform: translateY(0);
            }
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #ffffff;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(20, 168, 0, 0.35);
            border-color: var(--secondary-color);
        }
        
        section {
            background: var(--section-bg);
            backdrop-filter: blur(15px);
            margin-bottom: 3rem;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.8s ease-out;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        [data-theme="dark"] section {
            background: var(--section-bg);
            border: 1px solid var(--border-color);
        }
        
        section:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h2 {
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        footer {
            background: rgba(1, 20, 16, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 3rem 0;
            margin: 0;
            width: 100%;
            border-top: 1px solid rgba(20, 168, 0, 0.15);
            box-sizing: border-box;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .whatsapp-link {
            background: #25d366;
            color: white;
            font-size: 1.3rem;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
        }
        
        .whatsapp-link:hover {
            background: #128c7e;
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }
        
        .social-links a:hover {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }
        
        .scroll-indicator {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            z-index: 1001;
            transition: width 0.3s ease;
        }
        
        @keyframes rotate3D {
            0% {
                transform: perspective(1000px) rotateX(-15deg) rotateY(-15deg) translateZ(-100px) scale(0.8);
                opacity: 0;
            }
            50% {
                transform: perspective(1000px) rotateX(5deg) rotateY(5deg) translateZ(20px) scale(1.05);
                opacity: 0.8;
            }
            100% {
                transform: perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0deg) scale(1);
                opacity: 1;
            }
        }
        
        @keyframes float3D {
            0%, 100% {
                transform: perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px) translateY(0px);
            }
            25% {
                transform: perspective(1000px) rotateX(2deg) rotateY(2deg) translateZ(10px) translateY(-5px);
            }
            75% {
                transform: perspective(1000px) rotateX(-2deg) rotateY(-2deg) translateZ(10px) translateY(-5px);
            }
        }
        
        @keyframes pulse3D {
            0% {
                transform: perspective(1000px) scale(1) rotateX(0deg) rotateY(0deg) translateZ(0deg);
                box-shadow: 0 0 0 0 rgba(20, 168, 0, 0.4);
            }
            50% {
                transform: perspective(1000px) scale(1.05) rotateX(2deg) rotateY(2deg) translateZ(15px);
                box-shadow: 0 0 30px 10px rgba(20, 168, 0, 0.2);
            }
            100% {
                transform: perspective(1000px) scale(1) rotateX(0deg) rotateY(0deg) translateZ(0deg);
                box-shadow: 0 0 0 0 rgba(20, 168, 0, 0.4);
            }
        }
        
        .logo {
            animation: none;
        }
        
        .project-card, .contact-card, .skill-category, .info-card, .feature-card, .work-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .project-card::before, .contact-card::before, .skill-category::before, .info-card::before, .feature-card::before, .work-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(20, 168, 0, 0.1) 50%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            border-radius: inherit;
        }
        
        .project-card:hover::before, .contact-card:hover::before, .skill-category:hover::before, .info-card:hover::before, .feature-card:hover::before, .work-card:hover::before {
            opacity: 1;
        }
        
        section::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            right: -50px;
            bottom: -50px;
            background: radial-gradient(circle at center, rgba(20, 168, 0, 0.05) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        
        section:hover::before {
            opacity: 1;
        }
        
        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 40%, rgba(0, 255, 136, 0.08) 50%, transparent 60%);
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            .nav-links {
                flex-direction: column;
                gap: 1rem;
            }
            
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .hero p {
                font-size: 1.1rem;
            }
            
            section {
                padding: 2rem 1.5rem;
            }
            
            h2 {
                font-size: 2rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="scroll-indicator"></div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <span class="logo-f">M</span>uhammad Makki
            </div>

            <a href="#contact" style="text-decoration: none;">
                <button class="hire-me-btn">Contact Me</button>
            </a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <div class="social-links">
                <a href="https://github.com" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://wa.me/03700668582" target="_blank" rel="noopener noreferrer" class="whatsapp-link">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
            <p>&copy; 2024 Makki's Portfolio. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Theme Management - permanently set to dark
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');


        
        // Particle Effects
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 8;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // 3D Mouse Movement Effect removed as per request for lower animations
        function init3DEffects() {
            // No-op or very subtle effect if needed
        }
        
        // Enhanced Scroll indicator
        window.addEventListener('scroll', () => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrollPercentage = (scrollTop / scrollHeight) * 100;
            document.querySelector('.scroll-indicator').style.width = scrollPercentage + '%';
            
            // Simplified scroll effect for header
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
                header.style.transform = 'translateY(0)';
            } else {
                header.classList.remove('scrolled');
                header.style.transform = 'translateY(0)';
            }
        });

        // Enhanced Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Smooth scrolling for anchor links with offset
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                const target = document.querySelector(targetId);
                if (target) {
                    const headerOffset = 80;
                    const elementPosition = target.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                    
                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });
                    
                    history.pushState(null, null, targetId);
                }
            });
        });

        // Enhanced Intersection Observer for 3D animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animation = 'fadeInUp 0.8s ease-out forwards';
                    entry.target.style.transform = 'translateY(0) scale(1)';
                }
            });
        }, observerOptions);

        // Observe all sections
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            init3DEffects();
            
            const sections = document.querySelectorAll('section');
            sections.forEach((section, index) => {
                observer.observe(section);
                // Stagger animation
                section.style.animationDelay = `${index * 0.1}s`;
            });
            
            // Add simple hover effect to cards
            const cards = document.querySelectorAll('.project-card, .contact-card, .skill-category, .info-card, .work-card');
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    card.style.transform = 'translateY(-5px)';
                });
                
                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'translateY(0)';
                });
            });
        });

        // Parallax effect removed to prevent layout overlapping
        
        // Enhanced 3D keyframes are now handled in the main style block statically
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
